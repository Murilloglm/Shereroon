# ShareRoom: API e interface no mesmo serviço Render, com HTTPS automático.
# Deploy: https://render.com/deploy?repo=https://github.com/Murilloglm/Shereroon
# Exige um projeto LiveKit Cloud real. Consulte docs/cloud-deploy.md antes de criar o serviço.
services:
  - type: web
    name: shareroom-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      # O Render fica na frente do serviço: o IP real do visitante vem no cabeçalho X-Forwarded-For.
      - key: TRUST_PROXY
        value: "1"
      # A interface usa /api nesta mesma origem; GitHub Pages não é necessário.
      - key: SERVE_WEB
        value: "1"
      - key: VITE_API_URL
        value: ""
      - key: VITE_BASE
        value: "./"
      # Chave que assina os convites. Gerada uma vez; se mudar, os links antigos param de valer.
      - key: APP_SECRET
        generateValue: true
      # Do painel do LiveKit Cloud (Settings → Keys). São segredos: ficam só aqui.
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      # RENDER_EXTERNAL_URL é fornecido pelo Render e aceito automaticamente pela API.
      # Opcional: adicione ALLOWED_ORIGINS no Dashboard para outros sites/domínios autorizados.
      # Opcional: adicione DATABASE_URL como segredo no Dashboard para contas, grupos e bots.
      # Sem DATABASE_URL, funcionam as salas por link; nenhum banco é criado por este Blueprint.
