name: Página de download do Cosmic Night

on:
  push:
    branches: [main]
    paths:
      - 'download-site/**'
      - '.github/workflows/download-page.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: download-site
      - name: Publicar página de download
        id: deployment
        uses: actions/deploy-pages@v5
